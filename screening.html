<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SwasthSathi | Health Screening</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/screening.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-light bg-white fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-success" href="index.html">
            <i class="bi bi-heart-pulse-fill"></i> SwasthSathi
        </a>
    </div>
</nav>

<!-- Screening Card -->
<div class="screening-card">

    <h2 class="section-title text-center mb-4">
        <i class="bi bi-clipboard2-pulse"></i> Patient Health Screening
    </h2>

    <form id="screeningForm">

        <!-- Basic Info -->
        <h5>Basic Information</h5>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label required">Full Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label required">Age</label>
                <input type="number" id="age" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label required">Gender</label>
                <select id="gender" class="form-select" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
        </div>

        <!-- Body Metrics -->
        <h5>Body Measurements</h5>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label required">Height (cm)</label>
                <input type="number" id="height" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label required">Weight (kg)</label>
                <input type="number" id="weight" class="form-control" required>
            </div>
        </div>

        <!-- Medical History -->
        <h5>Known Medical Conditions</h5>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Diagnosed Diabetes?</label>
                <select id="diabetes" class="form-select">
                    <option>No</option>
                    <option>Yes</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Diagnosed Hypertension?</label>
                <select id="hypertension" class="form-select">
                    <option>No</option>
                    <option>Yes</option>
                </select>
            </div>
        </div>

        <!-- Symptoms -->
        <h5>Symptoms (Last 2–4 Weeks)</h5>
        <div class="row">
            <div class="col-md-6">
                <strong>Diabetes Related</strong>
                <div class="form-check"><input type="checkbox" id="frequentUrination" class="form-check-input"><label class="form-check-label">Frequent urination</label></div>
                <div class="form-check"><input type="checkbox" id="excessiveThirst" class="form-check-input"><label class="form-check-label">Excessive thirst</label></div>
                <div class="form-check"><input type="checkbox" id="weightLoss" class="form-check-input"><label class="form-check-label">Unexplained weight loss</label></div>
                <div class="form-check"><input type="checkbox" id="fatigue" class="form-check-input"><label class="form-check-label">Frequent fatigue</label></div>
                <div class="form-check"><input type="checkbox" id="blurredVision" class="form-check-input"><label class="form-check-label">Blurred vision</label></div>
            </div>

            <div class="col-md-6">
                <strong>Hypertension Related</strong>
                <div class="form-check"><input type="checkbox" id="headache" class="form-check-input"><label class="form-check-label">Headache</label></div>
                <div class="form-check"><input type="checkbox" id="dizziness" class="form-check-input"><label class="form-check-label">Dizziness</label></div>
                <div class="form-check"><input type="checkbox" id="chestPain" class="form-check-input"><label class="form-check-label">Chest pain</label></div>
                <div class="form-check"><input type="checkbox" id="breathlessness" class="form-check-input"><label class="form-check-label">Shortness of breath</label></div>
            </div>
        </div>

        <!-- Lifestyle -->
        <h5>Lifestyle & Family History</h5>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Smoking</label>
                <select id="smoking" class="form-select">
                    <option>No</option>
                    <option>Yes</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Alcohol Consumption</label>
                <select id="alcohol" class="form-select">
                    <option>No</option>
                    <option>Occasionally</option>
                    <option>Frequently</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Family History (Diabetes / BP)</label>
                <select id="familyHistory" class="form-select">
                    <option>No</option>
                    <option>Yes</option>
                </select>
            </div>
        </div>

        <!-- Readings -->
        <h5>Recent Readings (Optional)</h5>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Blood Sugar (mg/dL)</label>
                <input type="number" id="sugar" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label">Blood Pressure (e.g. 120/80)</label>
                <input type="text" id="bp" class="form-control">
            </div>
        </div>

        <!-- Submit -->
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success btn-lg px-5">
                <i class="bi bi-save"></i> Save Screening
            </button>
        </div>

    </form>
</div>

<!-- JS -->
<script src="/screening.js"></script>

</body>
</html>
