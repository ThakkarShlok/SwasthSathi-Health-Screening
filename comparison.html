<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Screenings - SwasthSathi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/styles/base.css">
    <link rel="stylesheet" href="assets/styles/language-modal.css">
    <link rel="stylesheet" href="assets/styles/dashboard.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container mt-5 pt-5 pb-5">

    <div id="comparisonLoading" class="text-center py-5">
        <div class="spinner-border text-success" style="width: 3rem; height: 3rem;"></div>
        <p class="mt-3 text-muted" data-i18n="comparison_loading">Loading your screening comparison...</p>
    </div>

    <div id="comparisonEmpty" style="display:none">
        <div class="text-center py-5">
            <i class="bi bi-graph-up-arrow" style="font-size: 4rem; color: #6b7280;"></i>
            <h4 class="mt-3" data-i18n="comparison_empty_title">Not enough screenings to compare</h4>
            <p class="text-muted" data-i18n="comparison_empty">You need at least 2 screenings to compare. Take another screening to see progress.</p>
            <a href="screening.html" class="btn btn-success mt-2">
                <i class="bi bi-plus-circle"></i> <span data-i18n="btn_new_screening">New Screening</span>
            </a>
        </div>
    </div>

    <div id="comparisonContent" style="display:none">

        <div class="mb-4">
            <h2 data-i18n="comparison_title">Your Screening Journey</h2>
            <p class="lead text-muted" data-i18n="comparison_subtitle">Track how your health assessment has evolved</p>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-primary-subtle">
                <h5 class="mb-0"><i class="bi bi-pie-chart-fill"></i> <span data-i18n="comparison_summary">Summary</span></h5>
            </div>
            <div class="card-body" id="comparisonSummary"></div>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-primary-subtle">
                <h5 class="mb-0"><i class="bi bi-clock-history"></i> <span data-i18n="comparison_timeline">Timeline</span></h5>
            </div>
            <div class="card-body">
                <div class="row g-3" id="comparisonTimeline"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-primary-subtle">
                <h5 class="mb-0"><i class="bi bi-arrow-left-right"></i> <span data-i18n="comparison_latest_vs_previous">Latest vs Previous</span></h5>
            </div>
            <div class="card-body" id="comparisonLatestVsPrevious"></div>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-primary-subtle">
                <h5 class="mb-0"><i class="bi bi-graph-up"></i> <span data-i18n="comparison_factor_evolution">Factor Evolution</span></h5>
            </div>
            <div class="card-body" id="comparisonFactorEvolution"></div>
        </div>

    </div>

</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/scripts/data/language-data.js"></script>
<script src="assets/scripts/shared/i18n.js"></script>
<script src="assets/scripts/shared/language-modal.js"></script>
<script src="assets/scripts/shared/supabase-client.js"></script>
<script src="assets/scripts/shared/navbar.js"></script>
<script src="assets/scripts/shared/footer.js"></script>
<script src="assets/scripts/shared/nav-auth.js"></script>
<script src="assets/scripts/modules/risk-calculator.js"></script>
<script src="assets/scripts/modules/factor-explanations.js"></script>
<script src="assets/scripts/pages/comparison.js"></script>
</body>
</html>
