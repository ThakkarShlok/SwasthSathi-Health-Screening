<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SwasthSathi</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/styles/base.css">
    <link rel="stylesheet" href="assets/styles/language-modal.css">
    <link rel="stylesheet" href="assets/styles/auth.css">
    <!-- PWA + icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SwasthSathi">
    <link rel="stylesheet" href="assets/styles/pwa.css">
</head>
<body>

<div id="navbar-mount"></div>

<!-- Signup Form -->
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header text-center mb-4">
            <i class="bi bi-person-plus-fill auth-icon"></i>
            <h2 class="fw-bold">Create Account</h2>
            <p class="text-muted">Join SwasthSathi to track your health screenings</p>
        </div>

        <form id="signupForm">
            <!-- Full Name -->
            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="fullName" required 
                           placeholder="Enter your full name">
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email Address *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" required 
                           placeholder="your.email@example.com">
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Password *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" required 
                           minlength="8" placeholder="At least 8 characters">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
                <small class="text-muted">Minimum 8 characters</small>
            </div>

            <!-- City -->
            <div class="mb-3">
                <label for="city" class="form-label">City</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                    <input type="text" class="form-control" id="city" 
                           placeholder="e.g., Ahmedabad">
                </div>
            </div>

            <!-- State -->
            <div class="mb-3">
                <label for="state" class="form-label">State</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-map"></i></span>
                    <input type="text" class="form-control" id="state" 
                           placeholder="e.g., Gujarat">
                </div>
            </div>

            <!-- Privacy Notice -->
            <div class="alert alert-info small mb-3">
                <i class="bi bi-shield-check"></i>
                <strong>Privacy:</strong> We only collect basic information. 
                No sensitive medical data is stored without your consent.
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary-custom w-100 mb-3" id="submitBtn">
                <i class="bi bi-person-check"></i> Create Account
            </button>

            <!-- Login Link -->
            <div class="text-center">
                <small class="text-muted">
                    Already have an account? 
                    <a href="login.html" class="fw-bold">Login here</a>
                </small>
            </div>
        </form>
    </div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/scripts/data/language-data.js"></script>
<script src="assets/scripts/shared/i18n.js"></script>
<script src="assets/scripts/shared/language-modal.js"></script>
<script src="assets/scripts/shared/supabase-client.js"></script>
<script src="assets/scripts/shared/navbar.js"></script>
<script src="assets/scripts/shared/footer.js"></script>
<script src="assets/scripts/shared/nav-auth.js"></script>
<script src="assets/scripts/pages/signup.js"></script>
    <script src="assets/scripts/shared/pwa-register.js"></script>
</body>
</html>
