<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SwasthSathi</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<!-- Navigation (Same as other pages) -->
<nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <i class="bi bi-heart-pulse-fill"></i>
            SwasthSathi
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                <li class="nav-item ms-lg-3" id="navAuthSection"></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Login Form -->
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header text-center mb-4">
            <i class="bi bi-box-arrow-in-right auth-icon"></i>
            <h2 class="fw-bold">Welcome Back</h2>
            <p class="text-muted">Login to view your health screening history</p>
        </div>

        <form id="loginForm">
            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" required 
                           placeholder="your.email@example.com">
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" required 
                           placeholder="Enter your password">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary-custom w-100 mb-3" id="submitBtn">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>

            <!-- Signup Link -->
            <div class="text-center">
                <small class="text-muted">
                    Don't have an account? 
                    <a href="signup.html" class="fw-bold">Sign up here</a>
                </small>
            </div>

            <!-- Anonymous Option -->
            <div class="text-center mt-3">
                <hr>
                <small class="text-muted">
                    Or continue as <a href="screening.html" class="fw-bold">Guest</a> (no login required)
                </small>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <div class="text-center text-muted">
            <p class="mb-0">© 2025 SwasthSathi. Built for ImpactThon @KSV 2025-2026</p>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="supabase-client.js"></script>
<script src="nav-auth.js"></script>
<script src="login.js"></script>
</body>
</html>
