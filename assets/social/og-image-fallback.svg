<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SwasthSathi — guideline-grounded health screening">
  <defs>
    <linearGradient id="ssGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="12" fill="url(#ssGrad)"/>

  <!-- App-icon tile with the shield-leaf + pulse mark (drawn inline) -->
  <g transform="translate(510,64)">
    <rect width="180" height="180" rx="40" fill="url(#ssGrad)"/>
    <g transform="translate(28,20) scale(2.1)">
      <path d="M32 2 C32 2 54 8 54 8 C54 8 54 34 54 34 C54 50 44 60 32 64
               C20 60 10 50 10 34 C10 34 10 8 10 8 C10 8 32 2 32 2 Z"
            fill="#ffffff" opacity="0.22"/>
      <path d="M15 35 L23 35 L27 24 L33 46 L38 32 L42 35 L49 35"
            fill="none" stroke="#ffffff" stroke-width="3.4"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="600" y="330" text-anchor="middle"
        font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif"
        font-size="76" font-weight="800" fill="#1f2937" letter-spacing="-1">Swasth<tspan fill="url(#ssGrad)">Sathi</tspan></text>

  <!-- Tagline -->
  <text x="600" y="392" text-anchor="middle"
        font-family="Segoe UI, system-ui, sans-serif"
        font-size="30" font-weight="600" fill="#6b7280">Guideline-grounded health screening for India</text>

  <!-- Honest, non-diagnostic framing -->
  <text x="600" y="468" text-anchor="middle"
        font-family="Segoe UI, system-ui, sans-serif"
        font-size="22" font-weight="500" fill="#9ca3af">Diabetes &amp; hypertension risk awareness — an educational tool, not a diagnosis</text>

  <!-- Domain -->
  <text x="600" y="558" text-anchor="middle"
        font-family="Segoe UI, system-ui, sans-serif"
        font-size="26" font-weight="700" fill="#10b981">swasthsathi.app</text>
</svg>
